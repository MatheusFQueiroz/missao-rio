<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3EEE1">
<title>Missão Rio</title>
<meta name="description" content="Expedição pelos rios para crianças: leve o barquinho da nascente até a foz, aprenda sobre tipos, usos e cuidados com os rios, e descubra como a tecnologia e a IA ajudam a estudar a natureza. Geografia + Computação.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fontes/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/nunito-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="fundo" aria-hidden="true"></div>

<header class="barra">
  <button class="marca" id="btInicio" aria-label="Ir para o mapa da expedição"><span class="capi-mini" aria-hidden="true"></span><span><b>Missão Rio</b><small>Geografia + Computação</small></span></button>
  <button class="bt-barra" id="btMapa"><span>Mapa</span></button>
  <button class="bt-barra" id="btCaderno"><span>Caderno</span></button>
  <button class="bt-barra" id="btDiario"><span>Diário</span></button>
  <button class="bt-barra" id="btAjustes"><span>Ajustes</span></button>
</header>

<main>
  <section class="tela" id="mapa"></section>

  <section class="tela oculto" id="jogo">
    <div class="jogo-topo">
      <button class="bt-voltar" id="btVoltar">Mapa</button>
      <div class="chip" id="chipParada"></div>
      <div class="previa" id="previa" aria-hidden="true"></div>
      <button class="bt-redondo" id="btLivro" aria-label="Abrir o caderno de campo"></button>
      <button class="bt-redondo" id="btOuvir" aria-label="Ouvir a instrução"></button>
    </div>
    <div class="palco" id="palco"></div>
    <div class="aviso" id="aviso" aria-live="polite"></div>
  </section>

  <section class="tela oculto" id="caderno"></section>
  <section class="tela oculto" id="diario"></section>
  <section class="tela oculto" id="ajustes"></section>
</main>

<div class="veu oculto" id="janela" role="dialog" aria-modal="true"></div>
<div class="veu oculto" id="premio" role="dialog" aria-modal="true"></div>

<script src="icones.js"></script>
<script src="cenas.js"></script>
<script src="jogo.js"></script>
</body>
</html>
