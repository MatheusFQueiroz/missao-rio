<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MISSÃO RIO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Trebuchet MS",Verdana,sans-serif;color:#2A3081;background:#EAF4FB;display:flex;flex-direction:column;user-select:none}
header{background:#2A3081;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:24px;letter-spacing:1px}
.chip{font-size:19px;font-weight:bold;border-radius:12px;padding:7px 14px;white-space:nowrap}
#cF{background:#fff;color:#2A3081;margin-left:auto}#cE{background:#FFD900;color:#2A3081}
#palco{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:1.6vh 2vw;min-height:0}
button{font:inherit;cursor:pointer}
.bt{font-weight:bold;border:none;border-radius:16px;color:#fff;padding:1.6vh 30px;font-size:clamp(19px,3.2vh,27px);transition:transform .12s}
.bt:hover{transform:scale(1.05)}
.verde{background:#2F9E44}.azul{background:#1C7ED6}.indigo{background:#2A3081}

#festa,#livro{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:1.8vh;text-align:center;padding:3vh 24px;overflow-y:auto}
#festa{background:rgba(234,244,251,.97);z-index:20}
#livro{background:rgba(42,48,129,.55);z-index:30}
#festa>:first-child,#livro>:first-child{margin-top:auto}#festa>:last-child,#livro>:last-child{margin-bottom:auto}
.tit{font-size:clamp(26px,5.4vh,46px);font-weight:bold;line-height:1.15}
.sub{font-size:clamp(18px,3.1vh,27px);color:#333;max-width:900px;line-height:1.4}
.sub b{color:#1C7ED6}
.emoG{font-size:clamp(56px,11vh,104px);line-height:1}
.kick{font-size:clamp(14px,2.3vh,19px);font-weight:bold;letter-spacing:2px;color:#1C7ED6}
.perg{font-size:clamp(20px,3.4vh,30px);font-weight:bold;background:#FFF3BF;border-radius:16px;padding:1.2vh 24px;max-width:900px}
.ganho{font-size:clamp(20px,3.2vh,28px);font-weight:bold;color:#E67700}.ganho.cinza{color:#868E96}
.tot{font-size:clamp(26px,4.6vh,40px);font-weight:bold;background:#FFD900;border-radius:16px;padding:1vh 28px}
.pista{background:#fff;border-radius:16px;padding:1.3vh 2vw;font-size:clamp(18px,3.1vh,28px);font-weight:bold;text-align:center;max-width:1100px;box-shadow:0 4px 14px rgba(42,48,129,.12)}
.pn{display:inline-block;background:#1C7ED6;color:#fff;border-radius:999px;padding:2px 12px;font-size:.7em;vertical-align:middle;margin-right:8px;letter-spacing:1px}

.cartao{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(42,48,129,.12);padding:2.2vh 3vw;text-align:center;max-width:960px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1.1vh}
.tag{font-size:clamp(13px,2vh,17px);font-weight:bold;letter-spacing:1px;color:#fff;background:#1C7ED6;border-radius:999px;padding:5px 16px}
.emo{font-size:clamp(44px,9vh,86px);line-height:1}
.frase{font-size:clamp(21px,3.6vh,33px);font-weight:bold;line-height:1.25}
.desc{font-size:clamp(15px,2.3vh,20px);color:#555}
.opcoes{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:1100px}

.grade4 .op{min-width:0;width:calc(25% - 9px);padding:1vh 8px;font-size:clamp(16px,2.5vh,22px)}
.op.sim{background:#2F9E44;border-color:#2F9E44;color:#fff}.op.sim:hover{background:#37B24D}
.op.nao{background:#E8590C;border-color:#E8590C;color:#fff}.op.nao:hover{background:#F76707}

.cena{position:relative;width:min(94vw,calc((100vh - 210px) * 1.923));aspect-ratio:1000/520;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(42,48,129,.18);flex-shrink:0}

.pin{width:clamp(42px,7.5vh,60px);height:clamp(42px,7.5vh,60px);background:#2A3081;font-size:clamp(20px,3.6vh,30px)}
.pin:hover{background:#1C7ED6}
.pin.ok{background:#2F9E44}
.pin.off,.pin.off:hover{background:#ADB5BD;cursor:not-allowed}
.pin .rot{position:absolute;top:104%;left:50%;transform:translateX(-50%);background:#2F9E44;color:#fff;font-size:clamp(12px,2vh,16px);padding:2px 9px;border-radius:8px;white-space:nowrap}
.pin .rot:empty{display:none}
.hot{width:clamp(40px,7vh,56px);height:clamp(40px,7vh,56px);background:#E8590C;font-size:clamp(22px,4vh,32px);animation:pulsa 1.1s infinite}
.hot.ok{background:#2F9E44;animation:none;cursor:default}
.est{width:clamp(50px,9vh,74px);height:clamp(50px,9vh,74px);font-size:clamp(24px,4.4vh,36px);background:#ADB5BD;cursor:default}
.est.atual{background:#FFD900;animation:pulsa 1.1s infinite;cursor:pointer}

.est.bloq{opacity:.6}
.rotulo{position:absolute;transform:translateX(-50%);background:#fff;color:#2A3081;border-radius:999px;padding:3px 11px;font-weight:bold;font-size:clamp(11px,1.9vh,16px);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18)}

.barco{position:absolute;font-size:clamp(30px,6vh,52px);transform:translate(10%,-118%);transition:left 1.5s ease-in-out,top 1.5s ease-in-out;pointer-events:none;line-height:1}
@keyframes pulsa{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.13)}}
.saude{display:flex;align-items:center;gap:12px;font-weight:bold;font-size:clamp(17px,2.8vh,24px)}
.barra{width:clamp(180px,30vw,320px);height:22px;border-radius:11px;background:#DEE2E6;overflow:hidden;display:block}
.barra i{display:block;height:100%;background:linear-gradient(90deg,#8C6D46,#339AF0);transition:width 1s}
#rio4{transition:fill 1.2s}
.chat{display:flex;flex-direction:column;gap:1.4vh;width:100%}
.msg{display:flex;gap:12px;align-items:flex-start;text-align:left}
.msg.ia{flex-direction:row-reverse;text-align:left}
.av{font-size:clamp(36px,7vh,62px);line-height:1}

.msg small{display:block;font-size:clamp(12px,1.9vh,15px);color:#868E96;font-weight:normal;letter-spacing:1px;text-transform:uppercase}
.livroBt{padding:1vh 22px;font-size:clamp(16px,2.6vh,22px)}
.livroCx{background:#fff;border-radius:22px;padding:2.4vh 28px;max-width:1100px;width:100%;text-align:left}
.livroCx h2{font-size:clamp(24px,4vh,34px);text-align:center;margin-bottom:1.4vh}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vh 28px}
.cols h3{font-size:clamp(17px,2.7vh,22px);color:#1C7ED6;margin-bottom:4px}
.cols li{font-size:clamp(15px,2.3vh,19px);color:#333;line-height:1.35;margin-left:20px}
.capa{display:flex;flex-direction:column;align-items:center;gap:2.2vh;text-align:center}
.titCapa{font-size:clamp(46px,10vh,92px);font-weight:bold;letter-spacing:3px;line-height:1}
.selo{font-size:clamp(14px,2.2vh,18px);font-weight:bold;background:#fff;border-radius:999px;padding:5px 16px;letter-spacing:1px}
#nome{font:inherit;font-size:clamp(22px,3.8vh,32px);padding:1.2vh 18px;border:3px solid #2A3081;border-radius:14px;width:min(520px,86vw);text-align:center;color:#2A3081;user-select:text}
.cert{background:#fff;border:6px double #2A3081;border-radius:24px;padding:2.2vh 4vw;display:flex;flex-direction:column;align-items:center;gap:1vh;text-align:center;max-width:980px;width:100%}
.titCert{font-size:clamp(30px,6vh,52px);font-weight:bold;letter-spacing:2px}
.nomeC{font-size:clamp(26px,5vh,44px);font-weight:bold;color:#1C7ED6;border-bottom:3px solid #FFD900;padding:0 20px}
.tab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8vh 26px;width:100%;max-width:820px;margin-top:.6vh}
.tab div{display:flex;justify-content:space-between;gap:10px;font-size:clamp(15px,2.5vh,21px);border-bottom:1px dashed #C5D5EA;padding-bottom:3px}
.data{font-size:clamp(14px,2.2vh,18px);color:#868E96}
</style></head><body>
<header><h1>🛶 MISSÃO RIO</h1><div class="chip" id="cF">—</div><div class="chip" id="cE">⭐ 0</div></header>
<div id="palco"></div><div id="aviso"></div><div id="festa"></div><div id="livro"></div>
<script>(function(){
var $=function(i){return document.getElementById(i)},palco=$('palco');
function emb(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cada(sel,fn,raiz){[].forEach.call((raiz||palco).querySelectorAll(sel),fn);}
function aviso(t){var a=$('aviso');a.innerHTML=t;a.style.display='block';clearTimeout(a._t);a._t=setTimeout(function(){a.style.display='none';},2000);}
function festa(html,bt,fn,cor){var f=$('festa');$('aviso').style.display='none';f.innerHTML=html+(bt?'<button class="bt '+(cor||'verde')+'" id="btF">'+bt+'</button>':'');f.style.display='flex';f.scrollTop=0;
  if(bt)$('btF').onclick=function(){f.style.display='none';if(fn)fn();};}
function fecha(){$('festa').style.display='none';}
function chip(t){$('cF').textContent=t;}
function mix(a,b,t){function h(c){return [1,3,5].map(function(i){return parseInt(c.substr(i,2),16);});}var x=h(a),y=h(b);return 'rgb('+x.map(function(v,i){return Math.round(v+(y[i]-v)*t);}).join(',')+')';}
function pontos(k,n){var h='<div class="pts">';for(var i=0;i<n;i++)h+='<i class="'+(i<k?'f':i===k?'a':'')+'"></i>';return h+'</div>';}
function ganhoTxt(g){return g===2?'<div class="ganho">+2 ⭐ de primeira!</div>':g===1?'<div class="ganho">+1 ⭐</div>':'<div class="ganho cinza">+0 ⭐ · na próxima, leia com calma!</div>';}
function xy(p){return 'left:'+(p[0]/10)+'%;top:'+(p[1]/5.2)+'%';}

var NOME='',ATUAL=0,EST=0,PTS=[0,0,0,0,0,0];
function ganha(g){EST+=g;PTS[ATUAL]+=g;$('cE').textContent='⭐ '+EST;}

/* ---------- PARADA 1 · PARTES DO RIO ---------- */
var P1=[
 {id:'nascente',nome:'NASCENTE',tit:'É a NASCENTE!',p:'Lugar onde o rio começa, quando a água brota do chão.',d:'Procure lá no alto da montanha, onde tudo começa.',x:'A nascente é onde o rio começa. A nascente do Rio São Francisco fica na Serra da Canastra, em Minas Gerais.'},
 {id:'curso',nome:'CURSO',tit:'É o CURSO do rio!',p:'Caminho que o rio percorre, da nascente até a foz.',d:'É o próprio rio correndo, lá no meio do caminho.',x:'O curso é todo o caminho que o rio faz, do começo até o fim.'},
 {id:'afluente',nome:'AFLUENTE',tit:'É um AFLUENTE!',p:'Rio menor que deságua em um rio maior.',d:'Procure um rio mais fino que se junta ao rio principal.',x:'O afluente é um rio menor que entrega a sua água para um rio maior. O Rio Negro é afluente do Rio Amazonas.'},
 {id:'foz',nome:'FOZ',tit:'É a FOZ!',p:'Lugar onde o rio termina, quando deságua no mar.',d:'Siga o rio até o fim, onde ele encontra o mar.',x:'A foz é onde o rio termina: no mar, num lago ou em outro rio. A foz do Rio Amazonas fica no Oceano Atlântico.'},
 {id:'bacia',nome:'BACIA HIDROGRÁFICA',tit:'É a BACIA HIDROGRÁFICA!',p:'Região formada pelo rio principal e todos os seus afluentes.',d:'Repare na linha tracejada em volta de todos os rios.',x:'A bacia hidrográfica é a região do rio principal com todos os afluentes. O oeste do Paraná faz parte da Bacia do Rio Paraná.'}
];
var PINS=[['nascente',195,212],['curso',371,246],['afluente',623,144],['foz',905,322],['bacia',862,135]];
var SVG1='<svg viewBox="0 0 1000 520">'+
 '<rect width="1000" height="520" fill="#CFEBB8"/>'+
 '<g fill="#8CC56B"><circle cx="300" cy="410" r="20"/><circle cx="330" cy="430" r="16"/><circle cx="520" cy="430" r="18"/><circle cx="555" cy="448" r="14"/><circle cx="720" cy="430" r="19"/><circle cx="760" cy="95" r="17"/><circle cx="790" cy="110" r="13"/><circle cx="470" cy="160" r="15"/><circle cx="90" cy="420" r="18"/></g>'+
 '<path d="M150,170 C200,40 520,10 700,30 C860,50 905,200 905,300 C905,420 600,470 420,430 C250,400 120,320 150,170 Z" fill="#2F9E44" fill-opacity=".10" stroke="#2A3081" stroke-width="4" stroke-dasharray="14 10"/>'+
 '<path d="M910,0 C890,150 930,300 900,520 L1000,520 L1000,0 Z" fill="#4DABF7"/>'+
 '<text x="965" y="260" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle" transform="rotate(90 965 260)" font-family="Trebuchet MS, Verdana, sans-serif">MAR</text>'+
 '<polygon points="30,340 140,110 200,190 255,95 350,340" fill="#A88B6E"/>'+
 '<polygon points="140,110 122,148 134,141 146,150 158,141 169,148" fill="#fff"/><polygon points="255,95 232,135 244,128 257,138 270,135" fill="#fff"/>'+
 '<g fill="none" stroke-linecap="round">'+
 '<path d="M420,55 C430,140 400,200 470,280" stroke="#1971C2" stroke-width="12"/><path d="M420,55 C430,140 400,200 470,280" stroke="#74C0FC" stroke-width="6"/>'+
 '<path d="M640,30 C600,120 650,220 606,352" stroke="#1971C2" stroke-width="13"/><path d="M640,30 C600,120 650,220 606,352" stroke="#74C0FC" stroke-width="7"/>'+
 '<path d="M195,212 C300,300 360,200 470,280 S640,380 720,320 S860,300 940,335" stroke="#1971C2" stroke-width="22"/><path d="M195,212 C300,300 360,200 470,280 S640,380 720,320 S860,300 940,335" stroke="#74C0FC" stroke-width="12"/></g>'+
 '<circle cx="195" cy="212" r="9" fill="#1971C2"/></svg>';
function partes(F){
 var lista=emb(F.itens),k=0,tent=0,nums=emb([1,2,3,4,5]);
 var h='<div class="pista" id="pista"></div><div class="cena">'+SVG1;
 PINS.forEach(function(p,i){h+='<button class="pin" data-id="'+p[0]+'" style="'+xy([p[1],p[2]])+'">'+nums[i]+'<span class="rot"></span></button>';});
 palco.innerHTML=h+'</div><div id="pp"></div>';
 var pins=[].slice.call(palco.querySelectorAll('.pin'));
 pins.forEach(function(b){b.onclick=function(){resp(b);};});
 function monta(){tent=0;var it=lista[k];$('pista').innerHTML='<span class="pn">PISTA '+(k+1)+' DE '+lista.length+'</span>'+it.p;
  pins.forEach(function(b){b.classList.remove('off');b.disabled=false;});$('pp').innerHTML=pontos(k,lista.length);}
 function resp(b){if(b.disabled)return;var it=lista[k];
  if(b.getAttribute('data-id')===it.id){var g=tent===0?2:tent===1?1:0;ganha(g);b.classList.add('ok');b.querySelector('.rot').textContent=it.nome;var ult=k===lista.length-1;
   festa('<div class="tit">'+it.tit+'</div><div class="sub">'+it.x+'</div>'+ganhoTxt(g),ult?'CONCLUIR A PARADA ✔':'PRÓXIMA PISTA →',function(){if(ult)fimFase();else{k++;monta();}});}
  else{tent++;b.classList.add('off');b.disabled=true;aviso(it.d);}}
 monta();
}

/* ---------- ENGINE DE ESCOLHA (paradas 2, 3, 5 e 6) ---------- */
function escolha(F){
 var lista=F.ordem(),k=0,tent=0;
 function monta(){tent=0;var it=lista[k],h='';
  if(F.livro)h+='<button class="bt indigo livroBt" id="abreLivro">📖 CONSULTAR O LIVRO</button>';
  h+='<div class="cartao">'+F.cartao(it)+'</div><div class="opcoes '+(F.grade||'')+'">';
  F.opcoes(it).forEach(function(o){h+='<button class="op '+(o.cls||'')+'" data-v="'+o.v+'">'+o.html+'</button>';});
  palco.innerHTML=h+'</div>'+pontos(k,lista.length);
  cada('.op',function(b){b.onclick=function(){resp(b);};});
  if(F.livro)$('abreLivro').onclick=abreLivro;}
 function resp(b){if(b.disabled)return;var it=lista[k];
  if(b.getAttribute('data-v')===it.c){var g=tent===0?2:tent===1?1:0;ganha(g);var ult=k===lista.length-1;
   festa('<div class="tit">'+F.titOk(it)+'</div><div class="sub">'+it.x+'</div>'+ganhoTxt(g),ult?'CONCLUIR A PARADA ✔':'PRÓXIMA →',function(){if(ult)fimFase();else{k++;monta();}});}
  else{tent++;b.disabled=true;b.classList.add('off');aviso(F.dica(it));}}
 monta();
}

/* ---------- PARADA 2 · TIPOS DE RIO ---------- */
function meses(seco){var s='<svg class="ico" viewBox="0 0 134 40">';for(var m=0;m<12;m++){var d=seco.indexOf(m)>=0;s+='<rect x="'+(m*11+2)+'" y="'+(d?22:4)+'" width="9" height="'+(d?6:30)+'" rx="2" fill="'+(d?'#E9C46A':'#1C7ED6')+'"/>';}return s+'<line x1="0" y1="36" x2="134" y2="36" stroke="#2A3081" stroke-width="2"/></svg>';}
var ICO={
 perene:meses([]),
 intermitente:meses([4,5,6,7,8,9]),
 planalto:'<svg class="ico" viewBox="0 0 134 60"><polygon points="0,60 0,14 54,14 54,40 134,46 134,60" fill="#8CC56B"/><path d="M0,13 L54,13" stroke="#1C7ED6" stroke-width="6"/><path d="M55,14 L57,40" stroke="#74C0FC" stroke-width="7"/><path d="M57,41 L134,46" stroke="#1C7ED6" stroke-width="6"/><circle cx="57" cy="42" r="6" fill="#fff" opacity=".8"/></svg>',
 planicie:'<svg class="ico" viewBox="0 0 134 60"><polygon points="0,60 0,40 134,40 134,60" fill="#8CC56B"/><path d="M0,40 L134,40" stroke="#1C7ED6" stroke-width="7"/><path d="M50,32 L84,32 L77,39 L57,39 Z" fill="#E8590C"/><path d="M67,32 L67,14 L79,30 Z" fill="#fff" stroke="#2A3081" stroke-width="2"/></svg>'};
var NT={perene:'PERENE',intermitente:'INTERMITENTE',planalto:'DE PLANALTO',planicie:'DE PLANÍCIE'};
var P2=[
 {g:'agua',emo:'💧📅',f:'Tem água o ano inteiro, mesmo na época de seca.',c:'perene',x:'O rio <b>perene</b> tem água o ano todo. Exemplos: Rio Amazonas e Rio Paraná.'},
 {g:'agua',emo:'🌵☀️',f:'Seca em algumas épocas do ano e volta a ter água quando chove.',c:'intermitente',x:'O rio <b>intermitente</b> é temporário: seca na época da seca e volta na época das chuvas.'},
